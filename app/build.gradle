plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanenashi.tomez'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hanenashi.tomez'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
